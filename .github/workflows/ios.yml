name: Build & Test iOS

# The example app build and the iOS harness run used to live in two workflows
# (`ios-build.yml` and the `test-ios` job of `harness-tests.yml`), each spinning
# up its own macOS runner to run a byte-identical `xcodebuild`. They are one job
# now: the harness needs the built .app anyway, so building it twice bought
# nothing. Triggers below are the union of what those two workflows watched.
#
# The job is still named "Harness Tests (iOS)" so the existing required status
# check on `main` keeps resolving. "Build iOS Example App" no longer exists.
#
# Set the repository variable RUN_HARNESS_TESTS=false to build without running
# the harness suite — see the comment on `HARNESS_ENABLED` below.
#
# (The push and pull_request path lists are duplicated on purpose — GitHub
# Actions does not support YAML anchors, so they have to be kept in sync by
# hand.)

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - test/harness-action
    paths:
      - '.github/workflows/ios.yml'
      - 'src/**'
      - 'ios/**'
      - 'cpp/**'
      - 'scripts/verify-blur.swift'
      - 'example/ios/**'
      - 'example/__tests__/**'
      - 'example/.harness/**'
      - 'example/rn-harness.config.mjs'
      - 'example/Gemfile'
      - 'example/Gemfile.lock'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - '**/Podfile.lock'
      - '**/bun.lock'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
      - 'package.json'
      - 'example/package.json'
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'src/**'
      - 'ios/**'
      - 'cpp/**'
      - 'scripts/verify-blur.swift'
      - 'example/ios/**'
      - 'example/__tests__/**'
      - 'example/.harness/**'
      - 'example/rn-harness.config.mjs'
      - 'example/Gemfile'
      - 'example/Gemfile.lock'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - '**/Podfile.lock'
      - '**/bun.lock'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
      - 'package.json'
      - 'example/package.json'
  workflow_dispatch:
    inputs:
      run_harness_tests:
        description: 'Run the harness suite (uncheck to build only)'
        type: boolean
        default: true

env:
  USE_CCACHE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Harness Tests (iOS)
    runs-on: macos-26
    env:
      # Kill switch. The app still gets built and the job still goes green;
      # only the suite is skipped, with a warning annotation on the run.
      #   - repository variable RUN_HARNESS_TESTS=false disables it everywhere,
      #     including on pull requests, without touching this file
      #   - unchecking the workflow_dispatch input disables it for one manual run
      HARNESS_ENABLED: ${{ vars.RUN_HARNESS_TESTS != 'false' && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_harness_tests == 'true') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '>=1.4.0'

      # Xcode 26.4 provides the iOS 26.4 runtime that rn-harness.config.mjs
      # pins for the iPhone 17 simulator.
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.4

      - name: Install dependencies
        run: bun install

      # Cheap (no Pods needed) and guards the cross-platform blur contract:
      # sigma is honoured, and blurred images keep opaque edges. Runs before the
      # build so a broken kernel fails in seconds rather than minutes.
      - name: Verify blur kernel
        run: bun run verify:blur

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: example/ios

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ~/.cocoapods/repos
            example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Install Pods
        working-directory: example/ios
        run: pod install

      - name: Build iOS Simulator App
        working-directory: example/ios
        run: |
          set -o pipefail && xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace NitroImagePipelineExample.xcworkspace \
            -scheme NitroImagePipelineExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            build \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      # The harness suites load their images from here instead of picsum.photos,
      # which used to fail the build whenever that host had a bad day. Backgrounded,
      # then polled, so the suites never race the socket.
      - name: Start fixture server
        if: env.HARNESS_ENABLED == 'true'
        run: |
          bun run fixtures &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8082/health >/dev/null; then
              echo "Fixture server up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Fixture server did not come up on :8082"
          exit 1

      - name: Run Harness Tests
        if: env.HARNESS_ENABLED == 'true'
        uses: callstackincubator/react-native-harness@v1.2.0
        with:
          runner: iphone-17
          app: ${{ github.workspace }}/example/ios/build/Build/Products/Debug-iphonesimulator/NitroImagePipelineExample.app
          projectRoot: example

      - name: Note skipped harness tests
        if: env.HARNESS_ENABLED != 'true'
        run: echo "::warning title=Harness tests skipped::The iOS harness suite did not run (RUN_HARNESS_TESTS is false). The app was still built."
