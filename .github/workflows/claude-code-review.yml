name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the conventions in CLAUDE.md. In particular:

            1. **Generated code** — files under `nitrogen/generated/` must never be hand-edited;
               changes there should only come from `bun run codegen`. Flag any manual edits.
            2. **Spec/implementation drift** — if `src/specs/nitro-image-toolkit.nitro.ts` changed,
               confirm `ios/HybridNitroImagePipeline.swift` and
               `android/.../HybridNitroImagePipeline.kt` were updated to match.
            3. **Blur sigma contract** — `blur`/`gaussianBlur radius` is the Gaussian standard
               deviation in source-image pixels on both platforms. If `ios/GaussianBlur.swift` or
               `android/.../transform/BlurTransformation.kt` changed, verify the sigma calibration
               and edge-clamping behavior (`kvImageEdgeExtend` / clamped RenderScript sampling)
               is preserved, and that `bun run verify:blur` still passes conceptually.
            4. **General correctness** — logic bugs, edge cases, error handling, race conditions.
            5. **Security** — unsafe input handling, unvalidated data crossing the JS/native bridge.
            6. **Style/consistency** — TypeScript/Swift/Kotlin conventions already used in the
               surrounding code; oxlint/swiftlint/ktfmt formatting.

            Skip nitpicks that `oxlint`/`swiftlint`/`ktfmt`/`tsc` already enforce in CI.
            Use inline comments for specific issues and a top-level summary comment overall.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
