name: Harness Tests (Android)

# The iOS harness run lives in `ios.yml`, together with the example app
# build it depends on. Keeping it here meant building that app twice.

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - test/harness-action
    paths:
      - 'src/**'
      - 'example/__tests__/**'
      - 'example/.harness/**'
      - '.github/workflows/harness-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'example/__tests__/**'
      - 'example/.harness/**'
      - '.github/workflows/harness-tests.yml'
      - 'package.json'
      - 'example/package.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-android:
    name: Harness Tests (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '>=1.4.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: bun install

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Android APK
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=x86_64

      - name: Run Harness Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          avd-name: Medium_Phone_API_36.1
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb reverse tcp:8081 tcp:8081
            adb install ${{ github.workspace }}/example/android/app/build/outputs/apk/debug/app-debug.apk
            cd example && bunx react-native-harness --harnessRunner medium_phone_api_36.1
